name: build

# Native MeshCore firmware, one release per upstream ref.
#
# Two things this is careful about. It does not rebuild a ref it has already
# released — an immutable tag that has a release is finished, and a branch is
# rebuilt only when upstream's commit actually moved. And it does not enumerate
# roles: a node is a node, and which application makes it a repeater rather than
# a companion is discovered from MeshCore's examples/ directory at build time,
# so a role added upstream tomorrow is built without this file changing.

on:
  workflow_dispatch:
    inputs:
      refs:
        description: 'Space-separated upstream refs to build; blank means every tag plus main and dev'
        required: false
        default: ''
      force:
        description: 'Rebuild even if a release already exists'
        type: boolean
        default: false
      radioserver_only:
        description: 'Publish only radioserver, skipping every firmware role'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # so the backlog can queue its own next batch

env:
  UPSTREAM: meshcore-dev/MeshCore
  # Which platforms to publish. Only linux-amd64 is live: the Windows and macOS
  # cross-builds do not compile yet (MSIM-44), and shipping a release that is
  # missing two thirds of its matrix every night is noise rather than signal.
  # Widen it with the PLATFORMS repository variable, no commit needed.
  PLATFORMS: ${{ vars.PLATFORMS || 'linux-amd64' }}
  # radioserver builds for platforms a node binary cannot. It is one translation
  # unit against VirtualSX1262 with no Arduino shims and no Crypto, so the
  # Windows and macOS builds that MSIM-44 blocks for firmware work here today —
  # which matters, because an operator on a Mac needs this one piece even when
  # every node they run is a Linux binary under emulation.
  RADIOSERVER_PLATFORMS: ${{ vars.RADIOSERVER_PLATFORMS || 'linux-amd64 darwin-arm64 windows-amd64' }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      backlog: ${{ steps.plan.outputs.backlog }}
      targets: ${{ steps.targets.outputs.targets }}
      rs_targets: ${{ steps.targets.outputs.rs_targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Which platforms are live
        id: targets
        run: |
          set -euo pipefail
          # Defined in platforms.json rather than inline, because a job-level
          # `if` cannot see `matrix` — a platform has to be filtered out before
          # the matrix exists, not skipped once it does. The entries that are not
          # live stay in the file as the record of how they are built.
          live=$(jq -c --arg want "$PLATFORMS" \
            '[.[] | select(.id as $id | ($want | split(" ")) | index($id))]' platforms.json)
          echo "targets=$live" >> "$GITHUB_OUTPUT"
          echo "building for: $(printf '%s' "$live" | jq -r '[.[].id] | join(", ")')"

          rs=$(jq -c --arg want "$RADIOSERVER_PLATFORMS" \
            '[.[] | select(.id as $id | ($want | split(" ")) | index($id))]' platforms.json)
          echo "rs_targets=$rs" >> "$GITHUB_OUTPUT"
          echo "radioserver for: $(printf '%s' "$rs" | jq -r '[.[].id] | join(", ")')"

      - name: Work out what still needs building
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.refs }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          git clone --bare --filter=blob:none "https://github.com/$UPSTREAM" upstream.git
          cd upstream.git

          if [ -n "${WANTED:-}" ]; then
            refs="$WANTED"
          else
            # Every tag ever released, plus the two moving targets. "All previous
            # versions" is not a fixed list — it is whatever upstream has tagged
            # by the time this runs.
            # Newest first, so a fresh clone of this repository produces useful
            # releases within the hour rather than starting at 2024.
            refs="main dev $(git tag --sort=-creatordate | tr '\n' ' ')"
          fi

          plan='[]'
          for ref in $refs; do
            # --verify, because plain rev-parse echoes its argument back and
            # exits zero-ish when it cannot resolve it: the guard below then
            # sees a non-empty "sha" that is really the ref name, and the build
            # matrix runs a job whose checkout cannot succeed. A ref that does
            # not exist should be skipped with the warning below, which is what
            # it says it does.
            sha=$(git rev-parse --verify --quiet "$ref^{commit}" \
                  || git rev-parse --verify --quiet "origin/$ref^{commit}" \
                  || true)
            case "$sha" in *[!0-9a-f]*|"") sha="" ;; esac
            if [ -z "$sha" ]; then
              echo "::warning::$UPSTREAM has no ref $ref; skipping"
              continue
            fi

            # A release already carrying this exact commit is finished. Tags
            # cannot move, so their release is final; main and dev are rebuilt
            # only when the commit they point at has actually changed.
            if [ "$FORCE" != "true" ]; then
              existing=$(gh release view "$ref" --repo "$GITHUB_REPOSITORY" \
                           --json body -q .body 2>/dev/null || true)
              if [ -n "$existing" ] \
                 && printf '%s' "$existing" | grep -qF "meshcore-commit: $sha" \
                 && printf '%s' "$existing" | grep -qF "variant-commit: $GITHUB_SHA"; then
                echo "$ref is already released at ${sha:0:8} — not rebuilding"
                continue
              fi
            fi

            plan=$(printf '%s' "$plan" | jq -c --arg r "$ref" --arg s "$sha" '. + [{ref:$r, sha:$s}]')
          done

          # A matrix is capped at 256 jobs and this one is refs x platforms, so a
          # hundred upstream tags will not fit in a single run. Whatever does not
          # fit is picked up by the next run, which is cheap: everything already
          # released is skipped above, so the backlog drains monotonically
          # instead of the whole history being recompiled each night.
          batch=$(( 256 / 8 ))
          total=$(printf '%s' "$plan" | jq 'length')
          backlog=$(( total > batch ? total - batch : 0 ))
          plan=$(printf '%s' "$plan" | jq -c ".[0:$batch]")

          echo "matrix=$(printf '%s' "$plan" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "any=$(printf '%s' "$plan" | jq 'length > 0')" >> "$GITHUB_OUTPUT"
          echo "backlog=$backlog" >> "$GITHUB_OUTPUT"
          printf '%s' "$plan" | jq -r '.[] | "will build \(.ref) at \(.sha[0:8])"'
          if [ "$backlog" -gt 0 ]; then
            echo "::notice::$backlog more refs queued for the next run"
          fi

  build:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
        ref: ${{ fromJSON(needs.discover.outputs.matrix).include }}
    runs-on: ${{ matrix.target.runs_on }}
    # A platform not in PLATFORMS is skipped, not removed: the entry above is
    # still the record of how it is built.
    # radioserver versions a wire protocol and is cut on its own schedule, so
    # publishing one must not drag every upstream ref for every platform along
    # with it: that is an hour of runners and a lot of ways to fail, for a
    # change to one translation unit.
    if: needs.discover.outputs.any == 'true' && !inputs.radioserver_only
    steps:
      - uses: actions/checkout@v4
        with:
          # The SX1262 model is a submodule now. Without this the
          # checkout is a bare gitlink and build.sh stops on its own
          # guard, which is the loud failure but still a failure.
          submodules: recursive

      - name: Toolchain
        if: matrix.target.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.target.apt }}

      - name: LLVM-MinGW for Windows on ARM
        if: matrix.target.llvm_mingw
        run: |
          set -euo pipefail
          # GCC has no Windows-on-ARM backend; clang does. This is the same
          # toolchain Microsoft's own ARM64 open-source builds use.
          url=https://github.com/mstorsjo/llvm-mingw/releases/download/20250910/llvm-mingw-20250910-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -fsSL "$url" | tar -xJ
          echo "$PWD/llvm-mingw-20250910-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: MeshCore ${{ matrix.ref.ref }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/$UPSTREAM MeshCore
          git -C MeshCore checkout --detach ${{ matrix.ref.sha }}
          # MeshCore's own dependency, pinned the way its lib_deps pins it.
          git clone --depth 1 https://github.com/rweather/arduinolibs arduinolibs

      - name: Build every role MeshCore ships
        id: build
        env:
          MESHCORE: ${{ github.workspace }}/MeshCore
          CRYPTO: ${{ github.workspace }}/arduinolibs/libraries/Crypto
          CXX: ${{ matrix.target.cxx }}
          CC: ${{ matrix.target.cc }}
          EXTRA_FLAGS: ${{ matrix.target.extra }}
          REF: ${{ matrix.ref.ref }}
        run: |
          set -uo pipefail
          os=${{ matrix.target.id }}; os=${os%%-*}
          arch=${{ matrix.target.id }}; arch=${arch##*-}
          export TARGET_OS=$os TARGET_ARCH=$arch
          mkdir -p out

          # Upstream tags a role at a time — repeater-v1.17.0, companion-v1.17.0,
          # room-server-v1.17.0 — so a tag says both which version and which node
          # type it is a release of. Building all six applications at
          # repeater-v1.16.0 would put a companion binary in a repeater's release
          # and claim a version for it that upstream never cut.
          #
          # The prefix is matched against the example directory names rather than
          # looked up in a table here: "repeater" finds simple_repeater and
          # "room-server" finds simple_room_server on their own, so a role
          # upstream starts tagging later needs no change. A ref with no role in
          # its name — main, dev — is a snapshot of everything, and builds
          # everything.
          all_roles=$(ls "$MESHCORE/examples")
          prefix=$(printf '%s' "$REF" | sed -E 's/-?v[0-9].*$//' | tr 'A-Z-' 'a-z_')
          roles="$all_roles"
          if [ -n "$prefix" ] && [ "$prefix" != "$REF" ]; then
            roles=$(printf '%s\n' $all_roles | grep -F "$prefix" || true)
            if [ -z "$roles" ]; then
              echo "::warning::$REF looks like a $prefix release but no example matches; building all"
              roles="$all_roles"
            fi
          fi
          echo "$REF -> $(printf '%s' "$roles" | tr '\n' ' ')"

          built=0; failed=0
          for role in $roles; do
            printf '%-24s ' "$role"
            if bin=$(./build.sh "$role" out 2>build-$role.log); then
              echo "ok  ->  $(basename "$bin")"
              built=$((built+1))
            else
              echo "not supported on this target"
              sed 's/^/    /' build-$role.log | head -6
              failed=$((failed+1))
            fi
          done
          echo "built=$built failed=$failed"
          # A target that produced nothing is a broken toolchain, not an
          # unsupported role, and should fail loudly.
          [ "$built" -gt 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ref.ref }}--${{ matrix.target.id }}
          path: out/meshcore-*
          if-no-files-found: error

  publish:
    needs: [discover, build]
    if: >-
      !cancelled() && needs.discover.outputs.any == 'true'
      && !inputs.radioserver_only
      && contains(fromJSON('["success", "failure"]'), needs.build.result)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.ref }}--*
          path: dist
          merge-multiple: true
        continue-on-error: true

      - name: Release ${{ matrix.ref }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)

          # Nothing built, nothing published. An empty release is worse than no
          # release: it replaces a good one, and it looks like a version that
          # exists and does not work.
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::warning::no binaries for ${{ matrix.ref }}; leaving any existing release alone"
            exit 0
          fi

          # The commit is the point of the body, not decoration: the next run
          # reads it back to decide whether this ref still needs building.
          {
            echo "Native MeshCore builds of \`${{ matrix.ref }}\`."
            echo
            echo "meshcore-commit: ${{ matrix.sha }}"
            # The variant is half of what produced these binaries. Keying the
            # skip on the upstream commit alone means a fix to the host variant
            # or the bridge never reaches a release that already exists — the
            # build is silently frozen at whatever this repository looked like
            # the first time that ref was seen.
            echo "variant-commit: ${{ github.sha }}"
            echo
            echo "Built from [${{ env.UPSTREAM }}](https://github.com/${{ env.UPSTREAM }}/commit/${{ matrix.sha }})"
            echo "against the host variant in this repository. One binary per role per"
            echo "architecture; a role absent below does not build for a desktop on this"
            echo "version of MeshCore."
            echo
              echo '| file | role | platform |'
            echo '|---|---|---|'
            for f in "${assets[@]}"; do
              b=$(basename "$f"); r=${b#meshcore-}
              echo "| \`$b\` | ${r%-*-*} | $(echo "$r" | grep -oE '[a-z0-9]+-[a-z0-9]+(\.exe)?$' | sed 's/\.exe$//') |"
            done
          } > notes.md

          prerelease=""
          [ "${{ matrix.ref }}" = "dev" ] && prerelease="--prerelease"

          if gh release view "${{ matrix.ref }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Branch releases move. Old assets are deleted rather than left
            # alongside the new ones, or a user downloads last week's dev build.
            gh release edit "${{ matrix.ref }}" --repo "$GITHUB_REPOSITORY" --notes-file notes.md $prerelease
            for a in $(gh release view "${{ matrix.ref }}" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              gh release delete-asset "${{ matrix.ref }}" "$a" --repo "$GITHUB_REPOSITORY" --yes
            done
          else
            gh release create "${{ matrix.ref }}" --repo "$GITHUB_REPOSITORY" \
              --title "MeshCore ${{ matrix.ref }} (native)" --notes-file notes.md $prerelease
          fi
          if [ ${#assets[@]} -gt 0 ]; then
            gh release upload "${{ matrix.ref }}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi

  # Chaining is off with the schedule: an unattended loop is only wanted once a
  # run cannot damage what is already published.
  # radioserver is ours, not upstream's: no MeshCore checkout, no role, and a
  # version that moves with this repository rather than with a MeshCore tag.
  # That is why it is its own job and its own release - the discover job above
  # reasons entirely about upstream refs and has nothing to say about whether
  # this needs building.
  #
  # It is built on every run rather than on a change to it, because it is one
  # compile of two files and deciding would cost more than doing.
  radioserver:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.rs_targets) }}
    runs-on: ${{ matrix.target.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The SX1262 model is a submodule now. Without this the
          # checkout is a bare gitlink and build.sh stops on its own
          # guard, which is the loud failure but still a failure.
          submodules: recursive

      - name: Toolchain
        if: matrix.target.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.target.apt }}

      - name: LLVM-MinGW for Windows on ARM
        if: matrix.target.llvm_mingw
        run: |
          set -euo pipefail
          url=https://github.com/mstorsjo/llvm-mingw/releases/download/20250910/llvm-mingw-20250910-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -fsSL "$url" | tar -xJ
          echo "$PWD/llvm-mingw-20250910-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build radioserver
        env:
          CXX: ${{ matrix.target.cxx }}
          CC: ${{ matrix.target.cc }}
          EXTRA_FLAGS: ${{ matrix.target.extra }}
        run: |
          set -euo pipefail
          os=${{ matrix.target.id }}; os=${os%%-*}
          arch=${{ matrix.target.id }}; arch=${arch##*-}
          export TARGET_OS=$os TARGET_ARCH=$arch
          ./build.sh radioserver out

      - uses: actions/upload-artifact@v4
        with:
          name: radioserver--${{ matrix.target.id }}
          path: out/radioserver-*
          if-no-files-found: error

  publish-radioserver:
    needs: radioserver
    # Every leg must have produced a binary. Unlike a role, which legitimately
    # does not exist on some upstream refs, radioserver is one file that either
    # compiles for a platform or is broken for it - and a release missing the
    # macOS binary silently strands every Mac operator on the previous protocol.
    if: ${{ !cancelled() && needs.radioserver.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: radioserver--*
          path: dist
          merge-multiple: true

      - name: Release radioserver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="radioserver-v$(cat radioserver.version)"

          assets=(dist/radioserver-*)
          [ ${#assets[@]} -gt 0 ] || { echo "::error::no radioserver binaries"; exit 1; }
          ( cd dist && sha256sum radioserver-* > SHA256SUMS )

          # The version is a file in this repository, bumped by hand, because
          # what it versions is a wire protocol rather than a build. QEMU speaks
          # it and the simulator reads what comes back, so a radioserver that
          # gained a command is not the same thing as one that did not - and the
          # two ends have to be able to say which they need.
          {
            echo "The SX1262 radio model every emulated node clocks over a socket."
            echo
            echo "radioserver-commit: ${{ github.sha }}"
            echo
            echo "Not versioned against upstream MeshCore: this is ours, has no role,"
            echo "and moves independently of the per-role releases. Wants neither a"
            echo "MeshCore checkout nor Crypto, just the chip model in"
            echo "\`vendor/virtual-sx1262\`."
            echo
            for f in "${assets[@]}"; do echo "- \`$(basename "$f")\`"; done
          } > notes.md

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            for a in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              gh release delete-asset "$tag" "$a" --repo "$GITHUB_REPOSITORY" --yes
            done
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "radioserver v$(cat radioserver.version) (native)" --notes-file notes.md
          fi
          gh release upload "$tag" dist/radioserver-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

  continue:
    if: false # was: !cancelled() && needs.discover.outputs.backlog != '0'
    needs: [discover, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Queue the next batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The next run re-derives what is still missing rather than being told,
          # so a release published by this run is skipped by the next one.
          echo "${{ needs.discover.outputs.backlog }} refs still to build"
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY"
